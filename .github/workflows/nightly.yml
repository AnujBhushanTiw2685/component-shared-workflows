name: Nightly Component Orchestrator

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:

env:
    OWNER: ${{ github.repository_owner }}
    REPOSITORIES: '["component1", "component2", "component3", "component4", "component5"]'
    WAIT_TIME: 40

jobs:
  nightly:

    runs-on: ubuntu-latest

    steps:

        - name: Checkout Repository
          uses: actions/checkout@v4

            # Trigger Nightly Pipelines
          
        - name: Trigger Nightly Pipelines
          env:
                GH_PAT: ${{ secrets.NOTIFICATION_FRAMEWORK_TOKEN }}

          run: |
                NIGHTLY_ID="nightly-${{ github.run_id }}"
                echo "Nightly Id: $NIGHTLY_ID"
                mkdir -p artifacts
                echo "[]" > artifacts/nightly_dispatches.json

                for repository in $(echo "$REPOSITORIES" | jq -r '.[]')
                do
                    echo "==================================="
                    echo "Processing $repository..."
                    echo "==================================="

                    # Get Workflows available in the repository
                    workflows_json=$(curl -sS \
                      -H "Authorization: Bearer $GH_PAT" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "https://api.github.com/repos/$OWNER/$repository/actions/workflows?per_page=100")

                    # Find the Release Pipeline workflow 
                    workflow_id=$(echo "$workflows_json" | jq -r '.workflows[] | select(.name == "Release Pipeline") | .id' | head -n 1)

                    if [ -z "$workflow_id" ]; then
                        echo "No Release Pipeline workflow found for $repository."
                        continue
                    fi

                    echo "Workflow ID: $workflow_id"

                    # Get the component repository's default branch
                    repository_info=$(curl -sS \
                      -H "Authorization: Bearer $GH_PAT" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "https://api.github.com/repos/$OWNER/$repository")

                      branch=$(echo "$repository_info" | jq -r '.default_branch')

                      if [ -z "$branch" ] || [ "$branch" = "null" ]; then
                          echo "Could not determine the default branch for $repository."
                          continue
                      fi

                      echo "Branch: $branch"

                      # Trigger the workflow
                      # dispatch_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                      dispatch_url="https://api.github.com/repos/$OWNER/$repository/actions/workflows/$workflow_id/dispatches?return_run_details=true"

                      status_code=$(curl -sS \
                        -o /tmp/dispatch_response.txt \
                        -w "%{http_code}" \
                        -X POST \
                        -H "Authorization: Bearer $GH_PAT" \
                        -H "Accept: application/vnd.github+json" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        "$dispatch_url" \
                        -d "{\"ref\":\"$branch\",
                             \"inputs\":{
                               \"trigger_type\":\"nightly\",
                               \"nightly_id\":\"$NIGHTLY_ID\"
                              
                              }
                        
                            }")

                      if [ "$status_code" = "200" ]; then
                          echo "Successfully triggered the Release Pipeline for $repository."
                          run_id=$(jq -r '.workflow_run_id' /tmp/dispatch_response.txt)
                          run_url=$(jq -r '.run_url' /tmp/dispatch_response.txt)

                          # Store dispatch information
                          tmp_file=$(mktemp)
                          jq \
                            --arg repository "$repository" \
                            --arg workflow_id "$workflow_id" \
                            --arg branch "$branch" \
                            --arg run_id "$run_id" \
                            --arg run_url "$run_url" \
                            --arg nightly_id "$NIGHTLY_ID"\
                            --arg dispatch_time "$dispatch_time" \
                            '. += [{"repository": $repository, "workflow_id": $workflow_id, "branch": $branch, "run_id": ($run_id | tonumber), "run_url": $run_url, "nightly_id": $nightly_id}]' \
                            artifacts/nightly_dispatches.json > "$tmp_file"
                            mv "$tmp_file" artifacts/nightly_dispatches.json
                      else
                          echo "Failed to trigger the Release Pipeline for $repository. Status code: $status_code"
                          cat /tmp/dispatch_response.txt
                      fi
                      
                    
                    echo

                done

                echo "===== NIGHTLY DISPATCH RECORD ====="
                cat artifacts/nightly_dispatches.json


        # Wait for all workflows to finish

        - name: Wait for Completion
          run: |
            
            echo "Waiting for $WAIT_TIME seconds..."
            sleep $WAIT_TIME

        # Collect workflow status

        - name: Collect Component Status
          env:
            OWNER: ${{ env.OWNER }}
            # COMPONENTS: "component1 component2 component3 component4 component5"
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


          run: |
            
            python scripts/collect-nightly-status.py

        # Generate and Send Nightly Email
        - name : Generate Nightly email
          env:
            MODE: nightly
          run: |
            python scripts/generate_email.py

        - name: Send Nightly Email
          env:
            MODE: nightly
            SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
            SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          run: |
            python scripts/smtp_sender.py

        
        # Upload Artifacts
        - name: Upload Nightly Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: nightly-artifacts
            path: artifacts/
          
